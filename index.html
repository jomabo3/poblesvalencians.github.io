<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Els meus Pobles Valencians</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #header { background-color: #1b4332; color: white; padding: 12px; text-align: center; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #header h1 { margin: 0 0 8px 0; font-size: 1.2rem; }
        
        .controls-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        #select-usuari {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            font-weight: bold;
            background-color: white;
            color: #1b4332;
            cursor: pointer;
        }

        .share-btn {
            background-color: #40916c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }
        .share-btn:hover { background-color: #2d6a4f; }

        #comptador { margin: 5px 0 0 0; font-size: 0.9rem; color: #d8f3dc; }
        #map { flex-grow: 1; width: 100%; }

        /* Estil per a les etiquetes permanents dels noms dels municipis */
        .etiqueta-municipi {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #1b4332;
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 9px;
            font-weight: bold;
            color: #1b4332;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            pointer-events: none; /* CLAU: Permet fer clic al polígon que hi ha davall del text */
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Els meus Pobles Valencians</h1>
        
        <div class="controls-container">
            <label for="select-usuari">Usuari: </label>
            <select id="select-usuari" onchange="canviarUsuari()"></select>
            <button class="share-btn" onclick="copiarEnllacCompartir()">📋 Copiar enllaç del meu mapa</button>
        </div>

        <p id="comptador">Carregant mapa...</p>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. LLISTA PREDEFINIDA D'AMICS (Modifica els noms com vulgues)
        const llistaAmics = ["Josep", "Mariona", "Usuari3", "Usuari4", "Usuari5"];

        // Configuració de Proj4js i Mapa
        proj4.defs("EPSG:25830", "+proj=utm +zone=30 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
        const map = L.map('map').setView([39.48, -0.37], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        let usuariActual = localStorage.getItem('pobles_usuari_actiu') || llistaAmics[0];
        let visitats = [];
        let geojsonLayer = null;
        let totalMunicipis = 0;

        // Omplir el menú desplegable d'usuaris
        const selectEl = document.getElementById('select-usuari');
        llistaAmics.forEach(nom => {
            const opt = document.createElement('option');
            opt.value = nom;
            opt.innerText = nom;
            if (nom === usuariActual) opt.selected = true;
            selectEl.appendChild(opt);
        });

        // Carregar dades des de l'enllaç compartit (si existeix)
        function carregarDesDeURL() {
            const hash = window.location.hash.substring(1);
            if (hash && hash.includes('=')) {
                const [usuariURL, ids] = hash.split('=');
                if (ids) {
                    const llistaIds = ids.split(',');
                    localStorage.setItem(`pobles_visitats_${usuariURL}`, JSON.stringify(llistaIds));
                    if (llistaAmics.includes(usuariURL)) {
                        usuariActual = usuariURL;
                        selectEl.value = usuariActual;
                    }
                }
            }
        }

        function carregarDadesUsuari() {
            const dadesGuardades = localStorage.getItem(`pobles_visitats_${usuariActual}`);
            visitats = dadesGuardades ? JSON.parse(dadesGuardades) : [];
            actualitzarMapa();
        }

        function guardarDadesUsuari() {
            localStorage.setItem(`pobles_visitats_${usuariActual}`, JSON.stringify(visitats));
            localStorage.setItem('pobles_usuari_actiu', usuariActual);
        }

        function canviarUsuari() {
            usuariActual = selectEl.value;
            localStorage.setItem('pobles_usuari_actiu', usuariActual);
            carregarDadesUsuari();
        }

        function copiarEnllacCompartir() {
            const urlBase = window.location.href.split('#')[0];
            const urlCompartir = `${urlBase}#${usuariActual}=${visitats.join(',')}`;
            
            navigator.clipboard.writeText(urlCompartir).then(() => {
                alert(`S'ha copiat l'enllaç del mapa de ${usuariActual} al teu portapapers!\nJa el pots enviar.`);
            }).catch(() => {
                prompt("Copia aquest enllaç manualment:", urlCompartir);
            });
        }

        function reprojectarCoordenades(coords) {
            if (typeof coords[0] === 'number') return proj4("EPSG:25830", "EPSG:4326", coords);
            return coords.map(reprojectarCoordenades);
        }

        function obtenirEstil(feature) {
            const id = feature.properties.MUNIINE;
            const estaVisitat = visitats.includes(id);
            return {
                fillColor: estaVisitat ? '#2d6a4f' : '#adb5bd',
                weight: 1, opacity: 1, color: '#ffffff',
                fillOpacity: estaVisitat ? 0.75 : 0.4
            };
        }

        function actualitzarComptador() {
            document.getElementById('comptador').innerText = `${usuariActual} ha visitat ${visitats.length} de ${totalMunicipis} pobles`;
        }

        function actualitzarMapa() {
            if (geojsonLayer) geojsonLayer.setStyle(obtenirEstil);
            actualitzarComptador();
        }

        // Carregar GeoJSON
        fetch('ca_municipios_20260805.geojson')
            .then(res => res.json())
            .then(data => {
                data.features.forEach(f => f.geometry.coordinates = reprojectarCoordenades(f.geometry.coordinates));
                totalMunicipis = data.features.length;

                geojsonLayer = L.geoJSON(data, {
                    style: obtenirEstil,
                    onEachFeature: function(feature, layer) {
                        const id = feature.properties.MUNIINE;
                        const nom = feature.properties.NOMBRE;

                        // Mostrar el nom de manera permanent al centre de la geometria
                        layer.bindTooltip(nom, {
                            permanent: true,
                            direction: 'center',
                            className: 'etiqueta-municipi'
                        });

                        layer.on('click', () => {
                            if (visitats.includes(id)) {
                                visitats = visitats.filter(item => item !== id);
                            } else {
                                visitats.push(id);
                            }
                            guardarDadesUsuari();
                            actualitzarMapa();
                        });
                    }
                }).addTo(map);

                map.fitBounds(geojsonLayer.getBounds());
                
                carregarDesDeURL();
                carregarDadesUsuari();
            });
    </script>
</body>
</html>
