<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Els meus Pobles Valencians</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Leaflet JS & html2canvas -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <!-- CAPÇALERA -->
    <header class="navbar">
        <div class="navbar-left">
            <span class="logo-title">Els meus Pobles Valencians</span>
            <select id="select-usuari" onchange="canviarUsuari(this.value)">
                <option value="Josep">Josep</option>
                <option value="Maria">Maria</option>
            </select>
        </div>

        <div class="navbar-right">
            <!-- 1. Estadístiques: només icona -->
            <button id="btn-stats" class="btn-icon" title="Estadístiques" onclick="obrirEstadistiques()">📊</button>

            <!-- 2. Compartir targeta: només icona de càmera -->
            <button id="btn-card" class="btn-icon" title="Compartir targeta" onclick="obrirModalTargeta()">📷</button>

            <!-- 3. Comparativa -->
            <button id="btn-compare" class="btn-text" onclick="obrirComparativa()">🔍 Comparativa</button>
        </div>
    </header>

    <!-- MAPA I CONTROLS FLOTANTS -->
    <main id="map-container">
        <div id="map"></div>

        <!-- BOTÓ FLOTANT DE CAPES (ESTIL GOOGLE MAPS) -->
        <div class="map-style-control">
            <button id="btn-layers-toggle" class="btn-layers-floating" title="Canviar estil del mapa">
                🥞 <span>Capes</span>
            </button>

            <!-- Menú desplegable de capes -->
            <div id="layers-menu" class="layers-menu hidden">
                <div class="layers-header">
                    <span>Tipus de mapa</span>
                    <button id="btn-close-layers" class="btn-close">&times;</button>
                </div>
                <div class="layers-options">
                    <button class="layer-option active" data-style="classic">
                        <div class="layer-preview preview-classic"></div>
                        <span>Clàssic</span>
                    </button>
                    <button class="layer-option" data-style="dark">
                        <div class="layer-preview preview-dark"></div>
                        <span>Fosc</span>
                    </button>
                    <button class="layer-option" data-style="satellite">
                        <div class="layer-preview preview-satellite"></div>
                        <span>Satèl·lit</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL TARGETA AMB IMATGE PER A DESCARREGAR -->
    <div id="modal-targeta" class="modal-overlay hidden">
        <div class="modal-content">
            
            <!-- Targeta que es capturarà -->
            <div id="card-template" class="card-box">
                <div class="card-header">
                    <span class="card-subtitle">MAPA D'EXPLORACIÓ</span>
                    <h2 id="card-name" class="card-title">Josep</h2>
                </div>

                <div class="card-map-wrapper">
                    <div id="mini-map"></div>
                    <div class="card-badge">
                        <span id="card-pct" class="card-pct-val">0%</span>
                        <span class="card-pct-label"><span id="card-visited-count">0</span> / <span id="card-total-count">542</span> pobles</span>
                    </div>
                </div>

                <div class="card-body">
                    <h3 class="card-section-title">DESGLOSSAMENT PER PROVÍNCIA</h3>
                    <div id="card-prov-list" class="card-prov-container">
                        <!-- Es genera dinàmicament per JS -->
                    </div>
                </div>

                <div class="card-footer">
                    <span>📍 Comunitat Valenciana</span>
                    <span>Els meus Pobles Valencians 🗺️</span>
                </div>
            </div>

            <!-- Botons d'acció del Modal -->
            <div class="modal-actions">
                <button class="btn-modal-close" onclick="tancarModalTargeta()">Tancar</button>
                <button class="btn-modal-download" onclick="descarregarImatgeTargeta()">⬇️ Descarregar PNG</button>
            </div>

        </div>
    </div>

    <!-- Script principal -->
    <script src="app.js"></script>
</body>
</html>
